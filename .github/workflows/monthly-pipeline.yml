name: Monthly pipeline check
# Mechanical half of the monthly growth-pipeline sweep (data/DATA_LOG.md item 13): lists register rows whose
# dates have passed and new-condo projects on SUUMO not seen at the last sweep, and sends a short Telegram
# summary. The research and scoring are done by Claude's monthly sweep, which also marks projects as seen.
on:
  schedule:
    - cron: '0 0 1 * *'   # 09:00 JST on the 1st of each month
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Summarise and send
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline_check.py --telegram
